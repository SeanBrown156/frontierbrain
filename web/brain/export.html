<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import {createBrain} from '/web/brain/brain.ts';
import {GLTFExporter} from 'three/examples/jsm/exporters/GLTFExporter.js';
const q=new URLSearchParams(location.search);const size=Number(q.get('s')??512);const c=document.getElementById('c');c.style.width=c.style.height=size+'px';
const b=createBrain(c,{detail:3,pixelRatio:1});b.renderer.toneMappingExposure=1.55;b.resize(size,size);b.camera.position.set(0,0.05,7.4);b.camera.lookAt(0,-0.2,0);
b.set({twist:0,yaw:0.0});for(let i=0;i<150;i++)b.frame(Number(q.get('t')??0.95));
window.glb=async()=>{const keep=b.group.children.filter(o=>o.isMesh&&o.material.blending===1);const g=new (await import('three')).Group();for(const m of keep)g.add(m.clone());
  const data=await new GLTFExporter().parseAsync(g,{binary:true});let s='';const u=new Uint8Array(data);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);};
window.done=true;
</script></body></html>
